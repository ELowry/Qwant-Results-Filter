<dialog id="qf-confirm-modal" class="qwant-filter-modal">
	<div class="qf-quick-settings-modal-content">
		<h3 id="qf-confirm-title" data-i18n="confirmModalTitleDefault">Confirm</h3>
		<p id="qf-confirm-message"></p>
		<div class="modal-actions">
			<button
				id="qf-confirm-cancel"
				class="qf-btn-base qf-btn-standard"
				data-i18n="confirmCancelButton"
			>
				Cancel
			</button>
			<button
				id="qf-confirm-submit"
				class="qf-btn-base qf-btn-standard qf-btn-primary"
				data-i18n="confirmSubmitButton"
			>
				Confirm
			</button>
		</div>
	</div>
</dialog>

<dialog id="qf-quick-settings-modal" class="qwant-filter-modal">
	<div class="qf-quick-settings-modal-content">
		<header>
			<h3 data-i18n="quickSettingsTitle">Results Filter Quick Settings</h3>
			<button
				tabindex="0"
				aria-label="Close"
				title="Close"
				id="qf-qs-close"
				class="qf-btn-base qf-btn-icon-circular"
				data-i18n-aria-label="modalCloseAriaLabel"
				data-i18n-title="modalCloseAriaLabel"
			>
				<svg
					stroke="currentColor"
					fill="currentColor"
					stroke-width="0"
					viewBox="0 0 24 24"
					height="1em"
					width="1em"
					xmlns="http://www.w3.org/2000/svg"
				>
					<path
						d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"
					></path>
				</svg>
			</button>
		</header>

		<div class="qf-toggle-wrapper">
			<div class="qf-toggle-label-container">
				<label
					for="qf-toggle-reveal-switch"
					class="qf-toggle-label"
					data-i18n="optionsRevealLabel"
					>Show Filtered Results (dimmed)</label
				>
			</div>
			<label class="qf-toggle-switch">
				<input type="checkbox" role="switch" id="qf-toggle-reveal-switch" />
				<span class="qf-toggle-slider"></span>
			</label>
		</div>

		<hr />
		<h4 id="qf-blocked-header" data-i18n="quickSettingsBlockedHeader">Blocked on this page:</h4>
		<ul id="qf-page-blocked-list" class="blocked-list"></ul>
		<hr />

		<div class="modal-actions">
			<button
				id="qf-open-options"
				class="qf-btn-base qf-btn-standard"
				data-i18n="quickSettingsOpenOptions"
			>
				Open Settings
			</button>
		</div>
	</div>
</dialog>

<template id="template-blocked-item">
	<li>
		<div class="qf-blocked-domain-info">
			<span class="qf-blocked-domain-name"></span>
		</div>
	</li>
</template>

<template id="template-unblock-button">
	<button
		class="qf-btn-base qf-btn-icon-rounded qf-btn-danger-solid"
		aria-label="Unblock domain"
		title="Unblock domain"
		data-i18n-aria-label="unblockDomainAriaLabel"
		data-i18n-title="unblockDomainAriaLabel"
	>
		<svg
			stroke="currentColor"
			fill="currentColor"
			stroke-width="0"
			viewBox="0 0 24 24"
			height="1em"
			width="1em"
			xmlns="http://www.w3.org/2000/svg"
		>
			<path
				d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"
			></path>
		</svg>
	</button>
</template>

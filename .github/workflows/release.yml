name: Release Qwant Filter

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
            artifact-metadata: write

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Enforce Main Branch
              run: |
                  # Get a list of remote branches that contain this commit
                  BRANCHES=$(git branch -r --contains ${{ github.sha }})

                  # Check if origin/main is in that list
                  if [[ ! "$BRANCHES" == *"origin/main"* ]]; then
                    echo "::error::Release tags must be cut from the main branch! This commit is not on main."
                    exit 1
                  fi
                  echo "Verified: Tag is on the main branch."

            - name: Verify Version Integrity
              run: |
                  # Remove the refs/tags/v part to get the raw tag (e.g., 0.2.1-beta)
                  FULL_TAG=${GITHUB_REF#refs/tags/v}

                  # Strip anything after the hyphen to get the base version (e.g., 0.2.1)
                  BASE_TAG_VERSION=${FULL_TAG%%-*}

                  # Read version from manifest.json
                  MANIFEST_VERSION=$(node -p "require('./src/manifest.json').version")

                  echo "Full Git Tag: $FULL_TAG"
                  echo "Base Tag Version: $BASE_TAG_VERSION"
                  echo "Manifest Version: $MANIFEST_VERSION"

                  if [ "$BASE_TAG_VERSION" != "$MANIFEST_VERSION" ]; then
                    echo "::error::Version mismatch! Base git tag ($BASE_TAG_VERSION) does not match manifest.json ($MANIFEST_VERSION)."
                    exit 1
                  fi

                  echo "Versions match. Proceeding with release."

            - name: Determine Release Mode
              id: mode
              run: |
                  if [[ "${{ github.ref_name }}" == *"-beta"* ]] || [[ "${{ github.ref_name }}" == *"-"* ]]; then
                    echo "IS_BETA=true" >> $GITHUB_ENV
                    echo "IS_PRERELEASE=true" >> $GITHUB_ENV
                    echo "::notice::Beta/Pre-release tag detected. Skipping AMO Listed submission."
                  else
                    echo "IS_BETA=false" >> $GITHUB_ENV
                    echo "IS_PRERELEASE=false" >> $GITHUB_ENV
                    echo "::notice::Stable release tag detected. Submitting to AMO Listed & Unlisted."
                  fi

            - name: Install Dependencies
              run: npm ci

            - name: Package Source Code
              run: npm run build:source

            - name: Submit Listed to AMO
              if: env.IS_BETA == 'false'
              env:
                  WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
                  WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
              run: |
                  npx web-ext sign \
                    --source-dir src \
                    --channel listed \
                    --api-key $WEB_EXT_API_KEY \
                    --api-secret $WEB_EXT_API_SECRET

            - name: Mutate Manifest Version for Unlisted Build
              run: |
                  node -e "const fs=require('fs'); const m=require('./src/manifest.json'); m.version += '.${{ github.run_number }}'; fs.writeFileSync('./src/manifest.json', JSON.stringify(m, null, '\t') + '\n');"

            - name: Sign & Download Unlisted XPI
              env:
                  WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
                  WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
              run: |
                  npx web-ext sign \
                    --source-dir src \
                    --artifacts-dir dist \
                    --channel unlisted \
                    --api-key $WEB_EXT_API_KEY \
                    --api-secret $WEB_EXT_API_SECRET

            - name: Generate Artifact Attestations
              if: github.event.repository.private == false
              uses: actions/attest@v4
              with:
                  subject-path: 'dist/*'

            - name: Generate Release Notes
              run: |
                  # Find the second most recent tag (the previous release)
                  PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')

                  # If a previous tag exists, log commits between then and now
                  if [ -n "$PREV_TAG" ]; then
                    git log ${PREV_TAG}..${{ github.ref_name }} --pretty=format:"- %s" > generated_notes.txt
                  else
                    # Fallback for the very first release
                    git log -5 --pretty=format:"- %s" > generated_notes.txt
                  fi

                  echo -e "\n\n**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> generated_notes.txt

            - name: Create GitHub Release
              id: create_release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      dist/*-source.zip
                      dist/*.xpi
                  draft: true
                  prerelease: ${{ env.IS_PRERELEASE == 'true' }}
                  body_path: generated_notes.txt
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Notify Discord
              uses: ELowry/discord-draft-notifier@v1
              with:
                  webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
                  version: ${{ github.ref_name }}
                  release_url: ${{ steps.create_release.outputs.url }}
                  notes_file_path: generated_notes.txt
